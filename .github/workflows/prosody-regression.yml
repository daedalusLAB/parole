name: Prosody interpolation regression

on:
  push:
    branches: [main, "fix/ci-prosody-regression"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install test dependencies
        run: |
          python -m pip install pytest pandas pyarrow
          Rscript -e 'install.packages("arrow"); stopifnot(requireNamespace("arrow", quietly = TRUE))'
      - name: Run the eight synthetic interpolation regression checks
        run: python -m pytest tests/test_prosody_interp.py -v
